name: JIKYEO
options:
  bundleIdPrefix: com.jikyeo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO

targets:
  JIKYEO:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: JIKYEOApp.swift
      - path: RootView.swift
      - path: DesignSystem
      - path: Core
      - path: Features
      - path: Resources
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jikyeo.app
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Info.plist
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_CFBundleDisplayName: "지켜"
        INFOPLIST_KEY_NSCameraUsageDescription: "약속을 사진으로 증명하기 위해 카메라를 사용해요."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "증명 사진 저장을 위해 사진첩을 사용해요."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "약속 장소에 도착했는지 확인하기 위해 위치를 사용해요."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UIBackgroundModes: remote-notification
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: JIKYEO.Debug.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: JIKYEO.Release.entitlements
